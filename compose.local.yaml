services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nerds_wildcam
      POSTGRES_USER: nerds_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerds_app -d nerds_wildcam"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - proxy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://nerds_app:local_dev_password@postgres:5432/nerds_wildcam
      DB_POOL_SIZE: "5"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/heartbeat').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nerds-local-proxy"
      - "traefik.http.routers.wildcam.rule=Host(`wildcam.localhost`)"
      - "traefik.http.routers.wildcam.entrypoints=websecure"
      - "traefik.http.routers.wildcam.tls=true"
      - "traefik.http.services.wildcam.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=nerds-local-proxy"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - proxy

networks:
  proxy:
    name: nerds-local-proxy

volumes:
  postgres_data:
